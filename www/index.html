<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConstruct 360</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e3a8a;
            font-size: 24px;
        }
        #paywall-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .paywall-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .pay-btn {
            display: inline-block;
            margin-top: 20px;
            background: #16a34a;
            color: #fff;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="paywall-overlay">
        <div class="paywall-card">
            <h2 style="color: #f87171; margin-top: 0;">Perioada de Test a Expirat</h2>

            <p>Poți achita licența rapid cu cardul, direct în contul tău PayPal (@allex23a).</p>
            <a href="https://paypal.me/allex23a" target="_blank" class="pay-btn">Plătește Licența Acum</a>
        </div>
    </div>

    <div class="container">
        <h1>ProConstruct 360</h1>
        <p>Aplicație de construcții.</p>
    </div>

</body>
</html>
