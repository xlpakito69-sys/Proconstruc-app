<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConstruct 360</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e3a8a;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <!-- Contor Trial & Buton Plată PayPal - Colț dreapta sus -->
    <div id="trial-counter" style="position: fixed; top: 15px; right: 15px; background: rgba(30, 58, 138, 0.95); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; z-index: 9999; box-shadow: 0 3px 6px rgba(0,0,0,0.3); text-align: right;">
        <div style="margin-bottom: 4px;">Trial: <span id="days-left">30</span> zile</div>
        <a href="https://paypal.me/allex23a" target="_blank" style="display: inline-block; background: #0070ba; color: #fff; padding: 4px 10px; font-size: 11px; border-radius: 4px; text-decoration: none; font-weight: bold;">Plătește PayPal</a>
    </div>

    <div class="container">
        <h1>ProConstruct 360</h1>
        <p>Bun venit în aplicația ta de construcții! Modulul trial de 30 de zile este activ.</p>
        <p>Pentru a debloca versiunea completă pe termen nelimitat, folosește butonul de plată din colțul dreapta sus pentru a trimite plata prin PayPal.</p>
    </div>

    <script>
        // Logica pentru contorul de 30 de zile
        const TRIAL_DAYS = 30;
        let startDate = localStorage.getItem('proconstruct_trial_start');

        if (!startDate) {
            startDate = new Date().getTime();
            localStorage.setItem('proconstruct_trial_start', startDate);
        }

        const now = new Date().getTime();
        const elapsedDays = Math.floor((now - parseInt(startDate)) / (1000 * 60 * 60 * 24));
        let daysLeft = TRIAL_DAYS - elapsedDays;

        if (daysLeft < 0) daysLeft = 0;

        document.getElementById('days-left').innerText = daysLeft;
    </script>
</body>
</html>
